base_url = "https://blog.martin.ae"
compile_sass = true
title = "blog.martin.ae"
description = "Guy Martin's blog"
generate_feeds = true
build_search_index = true
generate_sitemap = true
generate_robots_txt = true
minify_html = true

theme = "radion"

taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

default_language = "en"

[markdown]
bottom_footnotes = true
external_links_target_blank = true
external_links_external = true
lazy_async_image = true
insert_anchor_links = "heading"

[markdown.highlighting]
style = "class"
dark_theme = "material-theme-palenight"
light_theme = "everforest-light"

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_content = true

[extra]
author = "Guy Martin"
radion_title = "martin.ae"
radion_menu = [
    {url = "$BASE_URL", name = "Blog"},
    {url = "https://github.com/gmsoft-tuxicoman", name = "Github"},
    {url = "$BASE_URL/about/", name = "About"},
]
codeblock = true
enable_search = true
theme = "toggle"
favicon = true
comments = false
latex = false
